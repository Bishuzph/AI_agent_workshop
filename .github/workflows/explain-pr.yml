name: Explain PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          mode: agent
          prompt: |
            Read the diff between origin/${{ github.base_ref }} and HEAD,
            then post a sticky comment on PR #${{ github.event.pull_request.number }}
            with sections:
            1. Summary (2-3 sentences)
            2. Key changes (bullets)
            3. Risk areas
            4. Suggested test focus

            Use `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
          allowed_tools: "Bash(git diff:*),Bash(gh pr comment:*),Read,Grep,Glob"
