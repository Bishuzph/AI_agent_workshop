name: Explain PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-base-action@beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash,Read,Grep,Glob"
          prompt: |
            You are running in a GitHub Action.
            GH_TOKEN, PR_NUMBER, BASE_REF are set.

            Execute:
            1. `git diff origin/$BASE_REF...HEAD` — read the PR diff.
            2. Compose explanation with sections:
               - Summary (2-3 sentences)
               - Key changes (bullets)
               - Risk areas
               - Suggested test focus
            3. Post sticky comment using:
               `gh pr comment $PR_NUMBER --body "<your explanation>"`

            Execute each step. Do not just describe — run commands.
