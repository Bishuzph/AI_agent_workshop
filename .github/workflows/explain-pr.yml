name: Explain PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1.0.130
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Explain pull request #${{ github.event.pull_request.number }}.

            Steps:
            1. Read the diff: `git diff origin/${{ github.base_ref }}...HEAD`.
            2. Compose an explanation with sections:
               - Summary (2-3 sentences)
               - Key changes (bullets)
               - Risk areas / things to review carefully
               - Suggested test focus
            3. Post the explanation as a PR comment:
               `gh pr comment ${{ github.event.pull_request.number }} --body "<your text>"`.
