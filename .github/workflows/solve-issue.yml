name: Solve Issue

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  solve:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'claude-solve')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/solve'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1.0.130
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Solve issue #${{ github.event.issue.number }} titled
            "${{ github.event.issue.title }}".

            Steps:
            1. Read the issue body with `gh issue view ${{ github.event.issue.number }}`.
            2. Investigate the codebase.
            3. Create branch `claude/issue-${{ github.event.issue.number }}`.
            4. Edit files to fix the issue.
            5. Commit changes referencing the issue.
            6. Push the branch.
            7. Open a PR titled "Fix #${{ github.event.issue.number }}: <short>"
               with body containing "Closes #${{ github.event.issue.number }}",
               your summary, and a note that the change is AI-generated.

            If the issue is unclear or unsolvable, comment on the issue
            explaining why instead of opening a PR.
