name: Solve Issue

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  solve:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'claude-solve')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/solve'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          mode: agent
          prompt: |
            Read GitHub issue #${{ github.event.issue.number }} in this repo
            (title: "${{ github.event.issue.title }}"). Use `gh issue view` for body.

            Investigate the codebase, then implement a fix:
            1. Create branch `claude/issue-${{ github.event.issue.number }}`.
            2. Edit files to address the issue.
            3. Commit with message referencing issue.
            4. Push branch.
            5. Open PR with `gh pr create` titled "Fix #${{ github.event.issue.number }}: <short>"
               and body "Closes #${{ github.event.issue.number }}" plus your summary.
            6. AI-generated warning in PR body.

            If issue is unclear or unsolvable, post comment on issue with
            `gh issue comment ${{ github.event.issue.number }}` explaining why
            and skip the PR.
          allowed_tools: "Bash,Read,Write,Edit,Grep,Glob"
