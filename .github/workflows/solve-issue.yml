name: Solve Issue

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: solve-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  solve:
    name: Claude Solves Issue #${{ github.event.issue.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Trigger conditions:
    # 1. A label named 'claude-solve' was added to an issue
    # 2. A repo owner/collaborator comments '/solve' on an issue (not a PR)
    if: |
      (
        github.event_name == 'issues' &&
        github.event.label.name == 'claude-solve'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        contains(github.event.comment.body, '/solve') &&
        (
          github.event.comment.user.login == github.repository_owner ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR' ||
          github.event.comment.author_association == 'OWNER'
        )
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: React to trigger comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            /repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='+1'

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1.0.130
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a careful, senior software engineer.

            Your task is to resolve GitHub issue #${{ github.event.issue.number }}.

            Follow these steps exactly:

            1. Read the full issue using:
                 gh issue view ${{ github.event.issue.number }}

            2. Thoroughly explore the codebase to understand the context and
               identify all files that may need changes.

            3. Create a new branch named:
                 claude/issue-${{ github.event.issue.number }}

            4. Make the minimal, focused changes needed to fix the issue.
               Do not refactor or change unrelated code.

            5. Commit your changes with a descriptive message referencing
               the issue, e.g.:
                 fix: resolve issue #${{ github.event.issue.number }} - <short description>

            6. Push the branch to origin.

            7. Open a pull request with:
               - Title:  "Fix #${{ github.event.issue.number }}: <short description>"
               - Body must include:
                   * "Closes #${{ github.event.issue.number }}"
                   * A summary of what was changed and why
                   * "⚠️ This PR was generated by Claude Code (AI). Please review carefully before merging."

            Important:
            - If the issue is unclear, ambiguous, or cannot be safely resolved,
              do NOT open a PR. Instead, comment on the issue explaining what
              information is missing or why it cannot be automated.
            - Never force-push or modify any existing branch other than the
              one you create.
            - Never commit secrets, credentials, or sensitive data.